<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Billiard Arcade</title>
    <style>
      html,
      body,
      canvas {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        position: absolute;
        background: black;
        z-index: 0;
      }
      .loading-progress {
        color: white;
        position: absolute;
        bottom: 10%;
        left: 5%;
        right: 5%;
        text-align: center;
      }
      .test-ready-status {
        visibility: hidden;
        position: absolute;
        top: 0;
        left: 0;
      }
    </style>
    <link rel="dns-prefetch" href="//api.poki.com" />
    <link rel="dns-prefetch" href="//a.poki-cdn.com" />
    <script
      defer
      src="//game-cdn.poki.com/scripts/v2/poki-sdk.js"
      onload="poki_sdk_loaded()"
    ></script>
  </head>
  <body>
    <script id="poki-sdk-setup" type="text/javascript">
      var isPokiSDKInited = false;
      function poki_sdk_loaded() {
        PokiSDK.init().then(
          () => {
            isPokiSDKInited = true;
          },
          () => {
            isPokiSDKInited = true;
          }
        );
      }
    </script>
    <canvas id="glcanvas" tabindex="1"></canvas>
    <div class="loading-progress"></div>
    <script src="./build/mq_js_bundle.js"></script>
    <div class="test-ready-status"></div>
    <script>
      const debounce = (fn, wait) => {
        let timer;
        return (...args) => {
          clearTimeout(timer);
          timer = setTimeout(() => { fn(...args); }, wait);
        };
      };
      miniquad_add_plugin({
        register_plugin: (importObject) => {
          importObject.env.ext_js_game_loading_finished = () => {
            PokiSDK.gameLoadingFinished();
            // console.log("PokiSDK.gameLoadingFinished");
          };
          importObject.env.ext_js_gameplay_start = debounce(() => {
            PokiSDK.gameplayStart();
            // console.log("PokiSDK.gameplayStart()");
          }, 100);
          importObject.env.ext_js_gameplay_stop = () => {
            PokiSDK.gameplayStop();
            // console.log("PokiSDK.gameplayStop()");
          };
          importObject.env.ext_js_commercial_break = () => {
            // console.log('PokiSDK.commercialBreak()');
            PokiSDK.commercialBreak(() => {
              // you can pause any background music or other audio here
              wasm_exports.commercial_break_start();
              // console.log('wasm_exports.commercial_break_start()');
            }).then(() => {
              // console.log("Commercial break finished, proceeding to game");
              // if the audio was paused you can resume it here
              // (keep in mind that the function above to pause it might not always get called)
              // continue your game here
              wasm_exports.commercial_break_end();
              // console.log('wasm_exports.commercial_break_end()');
            });
          };
          importObject.env.ext_js_reward_break = () => {
            // pause your game here if it isn't already
            PokiSDK.rewardedBreak(() => {
              // you can pause any background music or other audio here
              wasm_exports.reward_break_start();
            }).then((success) => {
              if (success) {
                // video was displayed, give reward
                wasm_exports.reward_break_end_success();
              } else {
                // video not displayed, should not give reward
                wasm_exports.reward_break_end_fail();
              }
              // if the audio was paused you can resume it here
              // (keep in mind that the function above to pause it might not always get called)
              // continue your game here
            });
          };
        },
      });
      const progressEl = document.querySelector(".loading-progress");
      const testReadyStatus = document.querySelector(".test-ready-status");
      load(
        "./build/billiard-arcade.wasm",
        (percent) => {
          if (!progressEl) return;
          const num = Number(percent);
          const p = Math.floor(num * 100);
          const hide = !Number.isFinite(num) || p === 0 || p > 99;
          if (hide) {
            progressEl.style.display = "none";
            testReadyStatus.innerHTML = "ready";
          } else {
            progressEl.style.display = "block";
            progressEl.textContent = "Loading... " + p + "%";
          }
        }
      );
      // Prevent page jump.
      // When a player presses space or the arrow keys, the default browser behavior is to emulate scroll.
      // But in a game, we don’t want that.
      // It’s not noticeable in your development environment because your game is (probably) taking the full window.
      // But on Poki, it will be inside a longer page that can scroll.
      window.addEventListener('keydown', (ev) => {
        if (['ArrowDown', 'ArrowUp', ' '].includes(ev.key)) {
          ev.preventDefault();
        }
      });
      window.addEventListener('wheel', (ev) => ev.preventDefault(), { passive: false });
    </script>
  </body>
</html>
